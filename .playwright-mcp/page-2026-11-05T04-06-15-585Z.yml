              - heading "BIO" [level=2] [ref=f3e112]
              - generic [ref=f3e114]:
                - paragraph [ref=f3e115]: Associate Professor Thai Tran is a faculty member in the Department of Physiology at the National University of Singapore (NUS), where she serves as Deputy Head of Department and Assistant Dean (Research). She earned her PhD from the University of Melbourne and completed postdoctoral training at the University of Manitoba before joining NUS as an Assistant Professor and being promoted to Associate Professor with tenure in 2019.
                - paragraph [ref=f3e116]
                - paragraph [ref=f3e117]: She leads the Lung Diseases Research Laboratory, which investigates the role of extracellular matrix proteins and cell-matrix interactions in lung disease, with a particular focus on asthma, respiratory infections, and lung cancer, and on finding novel therapies for these diseases.
                - paragraph [ref=f3e118]
                - paragraph [ref=f3e119]: A/Prof Tran has received recognition for excellence in research, teaching, and graduate mentoring, including the NUSMed Young Researcher of the Year Award (2019), the NUSMed Faculty Teaching Excellence Award (2016, 2020), and the NUSMed Graduate Mentor of the Year Award (2018). She contributes actively to several committees, including the Associate Professor Faculty Promotion and Tenure Committee, the NUSMed Faculty Academic Advisory Committee, the Pharmacological Society of Singapore, where she serves as Vice-President, and the Scientific Committee of The Academic Respiratory Initiative for Pulmonary Health (TARIPH). She recently completed coaching training and now offers coaching support to medical and graduate students, as well as team coaching to support team development. She is the incoming president-elect for the Asian-Pacific Federation of Pharmacologists (APFP), which unites 10 member societies across Australia, China, Indonesia, Japan, Korea, Malaysia, Philippines, Taiwan, Thailand and Singapore for regional collaborations and scientific leadership to advance pharmacology, clinical pharmacology, toxicology and related fields across the Asia-Pacific region.
