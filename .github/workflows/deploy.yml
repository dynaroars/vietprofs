name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref group: GitHub keeps one pending run per group, so a shared group let a PR run displace
# (cancel) a queued main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check-protected-fields reads the base branch's roster
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Producer PRs must never change a protected directFields value (AGENTS.md "Direct updates").
      # The auditor's own PRs carry owner/Issue direct updates, so they are exempt.
      - if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[scheduled:') && !startsWith(github.event.pull_request.title, '[scheduled:audit]')
        run: npx tsx scripts/check-protected-fields.ts "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
