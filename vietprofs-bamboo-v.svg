<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">VietProfs bamboo V logo</title>
  <desc id="desc">Two stylized bamboo stalks and leaves forming a letter V, capped with a graduation cap.</desc>

  <!-- Left bamboo stalk -->
  <path fill="#2E9E64" d="M252 158c18-7 40-12 63-14l221 691c5 17-4 34-21 39l-13 4c-17 5-35-5-40-22L240 191c-5-14 0-27 12-33z"/>
  <!-- Right bamboo stalk -->
  <path fill="#2E9E64" d="M772 158c-18-7-40-12-63-14L488 835c-5 17 4 34 21 39l13 4c17 5 35-5 40-22l222-665c5-14 0-27-12-33z"/>

  <!-- Bamboo joints -->
  <path fill="#1D7A4C" d="M304 308l65-20 14 44-65 21zM365 499l65-21 15 46-65 20zM427 692l65-21 14 45-65 21z"/>
  <path fill="#1D7A4C" d="M720 308l-65-20-14 44 65 21zM659 499l-65-21-15 46 65 20zM597 692l-65-21-14 45 65 21z"/>

  <!-- Leaves: simple enough to remain clear at favicon size -->
  <path fill="#4FC08A" d="M316 292C210 246 145 251 104 279c62 68 131 87 218 56-3-16-5-29-6-43z"/>
  <path fill="#4FC08A" d="M708 292c106-46 171-41 212-13-62 68-131 87-218 56 3-16 5-29 6-43z"/>
  <path fill="#2E9E64" d="M356 456c-80-7-128 14-151 49 64 38 116 38 170-3-7-17-13-32-19-46z"/>
  <path fill="#2E9E64" d="M668 456c80-7 128 14 151 49-64 38-116 38-170-3 7-17 13-32 19-46z"/>

  <!-- Graduation cap, nested in the V's opening to mark this as academia. Gold fill with a
       dark outline reads on both light and dark page backgrounds. Scaled up around its own
       center so it reads clearly at favicon size without hand-recomputing every coordinate. -->
  <g transform="translate(512 150) scale(1.35) translate(-512 -150)">
    <path fill="#FFCC33" stroke="#1A1A1A" stroke-width="10" d="M480 158h64c8 0 14 6 14 14v34c0 20-16 32-46 32s-46-12-46-32v-34c0-8 6-14 14-14z"/>
    <path fill="#FFCC33" stroke="#1A1A1A" stroke-width="10" stroke-linejoin="round" d="M512 95L652 150 512 205 372 150z"/>
    <path fill="none" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round" d="M582 158c26 10 40 30 40 58"/>
    <path fill="none" stroke="#FFCC33" stroke-width="8" stroke-linecap="round" d="M582 158c26 10 40 30 40 58"/>
    <circle cx="622" cy="228" r="15" fill="#FFCC33" stroke="#1A1A1A" stroke-width="5"/>
    <circle cx="512" cy="150" r="12" fill="#1A1A1A"/>
  </g>
</svg>
